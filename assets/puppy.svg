<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .tail{transform-origin:148px 158px;animation:wag .5s ease-in-out infinite alternate}
    @keyframes wag{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
    @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
    .bob{animation:bob 2s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    .tongue{transform-origin:100px 118px;animation:pant 1.2s ease-in-out infinite}
    @keyframes pant{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.15)}}
  </style>
  <ellipse cx="100" cy="190" rx="55" ry="6" fill="#2E7D32" opacity=".15"/>
  <path class="tail" d="M148 158 C176 150 184 122 172 108" stroke="#C68B59" stroke-width="13" fill="none" stroke-linecap="round"/>
  <ellipse cx="100" cy="150" rx="48" ry="36" fill="#E0B084"/>
  <ellipse cx="118" cy="146" rx="14" ry="10" fill="#C68B59" opacity=".7"/>
  <ellipse cx="80" cy="182" rx="14" ry="8" fill="#FFF4E6"/>
  <ellipse cx="120" cy="182" rx="14" ry="8" fill="#FFF4E6"/>
  <g class="bob">
    <ellipse cx="54" cy="88" rx="18" ry="34" fill="#8B5A2B" transform="rotate(12 54 88)"/>
    <ellipse cx="146" cy="88" rx="18" ry="34" fill="#8B5A2B" transform="rotate(-12 146 88)"/>
    <circle cx="100" cy="88" r="44" fill="#E0B084"/>
    <ellipse cx="100" cy="106" rx="24" ry="19" fill="#FFF4E6"/>
    <circle cx="122" cy="72" r="10" fill="#C68B59" opacity=".7"/>
    <ellipse class="eye" cx="82" cy="82" rx="6" ry="7" fill="#2b2b2b"/>
    <ellipse class="eye" cx="118" cy="82" rx="6" ry="7" fill="#2b2b2b"/>
    <circle cx="84" cy="79" r="2" fill="#fff"/>
    <circle cx="120" cy="79" r="2" fill="#fff"/>
    <ellipse cx="100" cy="98" rx="9" ry="6" fill="#2b2b2b"/>
    <path d="M100 104 V110 M100 110 Q92 118 86 112 M100 110 Q108 118 114 112" stroke="#2b2b2b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path class="tongue" d="M94 114 Q100 132 106 114 Z" fill="#FF7A90"/>
  </g>
</svg>
