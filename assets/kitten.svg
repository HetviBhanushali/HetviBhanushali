<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .tail{transform-origin:150px 150px;animation:wag 1.8s ease-in-out infinite}
    @keyframes wag{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(14deg)}}
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
    .bob{animation:bob 2.4s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  </style>
  <ellipse cx="100" cy="190" rx="55" ry="6" fill="#2E7D32" opacity=".15"/>
  <path class="tail" d="M150 150 C185 140 192 105 170 92" stroke="#F4A259" stroke-width="12" fill="none" stroke-linecap="round"/>
  <ellipse cx="100" cy="150" rx="48" ry="36" fill="#F4A259"/>
  <ellipse cx="80" cy="182" rx="14" ry="8" fill="#FFF4E6"/>
  <ellipse cx="120" cy="182" rx="14" ry="8" fill="#FFF4E6"/>
  <g class="bob">
    <polygon points="55,72 60,30 90,55" fill="#F4A259"/>
    <polygon points="145,72 140,30 110,55" fill="#F4A259"/>
    <polygon points="62,62 64,42 80,55" fill="#FFC1CC"/>
    <polygon points="138,62 136,42 120,55" fill="#FFC1CC"/>
    <circle cx="100" cy="90" r="46" fill="#F4A259"/>
    <path d="M100 46 V60 M88 49 L90 60 M112 49 L110 60" stroke="#D9822B" stroke-width="4" stroke-linecap="round"/>
    <ellipse class="eye" cx="82" cy="88" rx="6" ry="8" fill="#2b2b2b"/>
    <ellipse class="eye" cx="118" cy="88" rx="6" ry="8" fill="#2b2b2b"/>
    <circle cx="84" cy="85" r="2" fill="#fff"/>
    <circle cx="120" cy="85" r="2" fill="#fff"/>
    <circle cx="68" cy="102" r="7" fill="#FF9AA2" opacity=".5"/>
    <circle cx="132" cy="102" r="7" fill="#FF9AA2" opacity=".5"/>
    <polygon points="94,100 106,100 100,108" fill="#E56B7F"/>
    <path d="M100 108 Q94 116 88 111 M100 108 Q106 116 112 111" stroke="#2b2b2b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M60 100 L36 96 M60 106 L36 108 M140 100 L164 96 M140 106 L164 108" stroke="#7a4a1d" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
